# 构建机内存有限，模板默认的 -Xmx8G/-XX:MaxMetaspaceSize=4G 偏大
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# JDK 装在 E 盘，固定下来避免依赖 JAVA_HOME
org.gradle.java.home=E:\\Project\\DEV\\jdk17
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 禁止 AGP 自动下载 SDK 组件（主要是 NDK 28.2，约 1.4GB）
android.builder.sdkDownload=false
# Windows 下 Kotlin 增量缓存偶发无法关闭（文件锁），关闭以稳定构建
kotlin.incremental=false
